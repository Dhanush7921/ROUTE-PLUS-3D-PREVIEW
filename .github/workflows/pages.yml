name: Publish independent ROUTE+ 3D preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: route-plus-3d-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'Dhanush7921/ROUTE-PLUS-3D-PREVIEW'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public content safety check
        run: node scripts/check-public.mjs
      - name: Focused offline engine and source checks
        run: node tests/verify.mjs
      - name: Package allowlisted website files
        run: node scripts/package-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
